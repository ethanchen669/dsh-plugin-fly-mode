# 本仓是"纯声明包"的 CI：不装依赖（8 个 dsh-plugin-fly-* 还没发布，装了一定失败 = 假红），
# 只跑包形状与两条红线的本地检查。真正的"声明与生成器同源"由 dsh-fly 仓的
# scripts/build-fly-mode-bundle.mjs --check 把关（生成器住在那儿）。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 全历史署名检查（内网身份一律拦下）
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '@users\.noreply\.github\.com$' || true)
          if [ -n "$bad" ]; then echo "非 GitHub 署名：$bad"; exit 1; fi
      - run: node scripts/verify.mjs
