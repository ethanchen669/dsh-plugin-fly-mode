# 发布：打 tag（v*）时用 OIDC + provenance 发到公开 npm。姿势照 @dsh-fly/dsh-plugin-fly-skins
# 那份（已在生产用过），差别：纯声明包 ⇒ 跑本地 scripts/verify.mjs（不装依赖、不构建）；
# 署名检查用等价的两行 git 查询；npm 升到 11（trusted publishing 需要 >= 11.5）。
# 发布前必须：8 个 dsh-plugin-fly-* 依赖先去 private 并发出去，否则本包发出去也装不上。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: 全历史署名检查（内网身份一律拦下，硬门：脏了就不发）
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '@users\.noreply\.github\.com$' || true)
          if [ -n "$bad" ]; then echo "非 GitHub 署名：$bad"; exit 1; fi
      - name: 发布前先跑本仓门禁
        run: node scripts/verify.mjs
      - name: npm 升到 11（trusted publishing 需要 npm >= 11.5）
        run: |
          npm install -g npm@11
          npm --version
      - name: 发布到公开 npm（OIDC + provenance）
        run: npm publish --access public --provenance
