# 发布：打 tag（v*）时用 OIDC + provenance 发到公开 npm。姿势照 @dsh-fly/dsh-plugin-fly-skins
# 那份（已在生产用过），差别：纯声明包 ⇒ 跑本地 scripts/verify.mjs（不装依赖、不构建）；
# 署名检查用等价的两行 git 查询；npm 升到 11（trusted publishing 需要 >= 11.5）。
# 发布前必须：唯一依赖 dsh-plugin-fly-smart 已在 npm 上（0.1.0 已发）；7 个工具已内联在包内。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 默认 depth=1 ⇒ "全历史署名检查"只看得到一笔 —— 那是把尺子遮住了
          # （皮肤仓原件同样写死 fetch-depth: 0，注释一模一样）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: tag 与 package.json 版本必须一致（tag 指错提交 = 发错版本）
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then echo "tag=$GITHUB_REF_NAME，但 package.json 里是 $want"; exit 1; fi
          echo "tag 与版本一致：$GITHUB_REF_NAME"
      - name: 全历史署名检查（内网身份一律拦下，硬门：脏了就不发）
        run: |
          bad=$(git log --format='%ae%n%ce' | sort -u | grep -v '@users\.noreply\.github\.com$' || true)
          if [ -n "$bad" ]; then echo "非 GitHub 署名：$bad"; exit 1; fi
      - name: 发布前先跑本仓门禁
        run: node scripts/verify.mjs
      - name: npm 升到 11（trusted publishing 需要 npm >= 11.5）
        run: |
          npm install -g npm@11
          npm --version
      - name: 发布到公开 npm（OIDC + provenance）
        run: npm publish --access public --provenance
